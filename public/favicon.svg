<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background with binary digits -->
  <rect width="32" height="32" fill="#0F0F0F"/>
  <text x="2" y="8" font-family="monospace" font-size="6" fill="#333" opacity="0.3">01</text>
  <text x="24" y="16" font-family="monospace" font-size="6" fill="#333" opacity="0.3">10</text>
  <text x="4" y="28" font-family="monospace" font-size="6" fill="#333" opacity="0.3">11</text>
  
  <!-- 4x4 Grid of squares -->
  <g transform="translate(4, 4)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="4" height="4" fill="#444" rx="1"/>
    <rect x="6" y="0" width="4" height="4" fill="url(#highlight)" rx="1"/>
    <rect x="12" y="0" width="4" height="4" fill="#555" rx="1"/>
    <rect x="18" y="0" width="4" height="4" fill="#333" rx="1"/>
    
    <!-- Row 2 -->
    <rect x="0" y="6" width="4" height="4" fill="#666" rx="1"/>
    <rect x="6" y="6" width="4" height="4" fill="#444" rx="1"/>
    <rect x="12" y="6" width="4" height="4" fill="url(#highlight)" rx="1"/>
    <rect x="18" y="6" width="4" height="4" fill="#555" rx="1"/>
    
    <!-- Row 3 -->
    <rect x="0" y="12" width="4" height="4" fill="#333" rx="1"/>
    <rect x="6" y="12" width="4" height="4" fill="#666" rx="1"/>
    <rect x="12" y="12" width="4" height="4" fill="#444" rx="1"/>
    <rect x="18" y="12" width="4" height="4" fill="url(#highlight)" rx="1"/>
    
    <!-- Row 4 -->
    <rect x="0" y="18" width="4" height="4" fill="#555" rx="1"/>
    <rect x="6" y="18" width="4" height="4" fill="#333" rx="1"/>
    <rect x="12" y="18" width="4" height="4" fill="#666" rx="1"/>
    <rect x="18" y="18" width="4" height="4" fill="#444" rx="1"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(20, 8)">
    <circle cx="6" cy="6" r="4" fill="none" stroke="#00FFFF" stroke-width="1.5"/>
    <line x1="8.5" y1="8.5" x2="10" y2="10" stroke="#00FFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
