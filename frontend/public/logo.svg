<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background with binary digits -->
  <rect width="48" height="48" fill="#0F0F0F"/>
  <text x="3" y="12" font-family="monospace" font-size="9" fill="#333" opacity="0.3">01</text>
  <text x="36" y="24" font-family="monospace" font-size="9" fill="#333" opacity="0.3">10</text>
  <text x="6" y="42" font-family="monospace" font-size="9" fill="#333" opacity="0.3">11</text>
  
  <!-- 4x4 Grid of squares -->
  <g transform="translate(6, 6)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="6" height="6" fill="#444" rx="1.5"/>
    <rect x="9" y="0" width="6" height="6" fill="url(#highlight)" rx="1.5"/>
    <rect x="18" y="0" width="6" height="6" fill="#555" rx="1.5"/>
    <rect x="27" y="0" width="6" height="6" fill="#333" rx="1.5"/>
    
    <!-- Row 2 -->
    <rect x="0" y="9" width="6" height="6" fill="#666" rx="1.5"/>
    <rect x="9" y="9" width="6" height="6" fill="#444" rx="1.5"/>
    <rect x="18" y="9" width="6" height="6" fill="url(#highlight)" rx="1.5"/>
    <rect x="27" y="9" width="6" height="6" fill="#555" rx="1.5"/>
    
    <!-- Row 3 -->
    <rect x="0" y="18" width="6" height="6" fill="#333" rx="1.5"/>
    <rect x="9" y="18" width="6" height="6" fill="#666" rx="1.5"/>
    <rect x="18" y="18" width="6" height="6" fill="#444" rx="1.5"/>
    <rect x="27" y="18" width="6" height="6" fill="url(#highlight)" rx="1.5"/>
    
    <!-- Row 4 -->
    <rect x="0" y="27" width="6" height="6" fill="#555" rx="1.5"/>
    <rect x="9" y="27" width="6" height="6" fill="#333" rx="1.5"/>
    <rect x="18" y="27" width="6" height="6" fill="#666" rx="1.5"/>
    <rect x="27" y="27" width="6" height="6" fill="#444" rx="1.5"/>
  </g>
  
  <!-- Magnifying glass -->
  <g transform="translate(30, 12)">
    <circle cx="9" cy="9" r="6" fill="none" stroke="#00FFFF" stroke-width="2"/>
    <line x1="12.5" y1="12.5" x2="15" y2="15" stroke="#00FFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
